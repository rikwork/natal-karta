<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #06060f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif
        }

        .phone {
            width: 390px;
            height: 844px;
            background: linear-gradient(160deg, #06060f 0%, #0d0820 50%, #06060f 100%);
            border-radius: 48px;
            overflow: hidden;
            position: relative;
            border: 1.5px solid rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 80px rgba(80, 0, 180, 0.3)
        }

        .stars {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 70% 30%, rgba(100, 20, 200, 0.35) 0%, transparent 70%), radial-gradient(ellipse 40% 40% at 20% 70%, rgba(60, 10, 150, 0.25) 0%, transparent 70%)
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: tw 3s infinite alternate
        }

        @keyframes tw {
            0% {
                opacity: .3
            }

            100% {
                opacity: 1
            }
        }

        .progress {
            position: absolute;
            top: 56px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px
        }

        .dots {
            display: flex;
            gap: 8px
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.3)
        }

        .dot.active {
            background: #FFD700;
            box-shadow: 0 0 8px #FFD700;
            width: 24px;
            border-radius: 4px
        }

        .prog-label {
            color: rgba(255, 215, 0, 0.6);
            font-size: 12px;
            font-family: sans-serif;
            letter-spacing: 2px
        }

        .content {
            position: absolute;
            top: 120px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px
        }

        .zodiac-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 6px 16px;
            margin-bottom: 20px
        }

        .zodiac-badge span:first-child {
            font-size: 18px
        }

        .zodiac-badge span:last-child {
            color: rgba(255, 215, 0, 0.8);
            font-size: 13px;
            font-family: sans-serif;
            letter-spacing: 1px
        }

        h1 {
            color: #FFD700;
            font-size: 30px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.4)
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-family: sans-serif;
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.5
        }

        .picker-wrap {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 24px;
            padding: 16px;
            backdrop-filter: blur(20px);
            position: relative
        }

        .cols-header {
            display: flex;
            justify-content: space-around;
            margin-bottom: 8px
        }

        .col-label {
            color: rgba(255, 215, 0, 0.5);
            font-size: 12px;
            font-family: sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex: 1;
            text-align: center
        }

        .cols {
            display: flex;
            height: 220px;
            position: relative
        }

        .selection-bar {
            position: absolute;
            left: 8px;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            height: 44px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(180, 100, 255, 0.12));
            border-top: 1px solid rgba(255, 215, 0, 0.35);
            border-bottom: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 8px;
            pointer-events: none;
            z-index: 2
        }

        .col {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative
        }

        .fade-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: linear-gradient(#06060f, transparent);
            z-index: 3;
            pointer-events: none
        }

        .fade-bot {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 88px;
            background: linear-gradient(transparent, #06060f);
            z-index: 3;
            pointer-events: none
        }

        .col-items {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 88px 0
        }

        .item {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.25);
            font-size: 15px;
            font-family: 'Georgia', serif;
            width: 100%
        }

        .item.sel {
            color: #FFD700;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5)
        }

        .item.near {
            color: rgba(255, 255, 255, 0.55);
            font-size: 17px
        }

        .continue-btn {
            margin-top: auto;
            margin-bottom: 40px;
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, #7b2fff, #a855f7, #c084fc);
            border: none;
            border-radius: 28px;
            color: #fff;
            font-size: 17px;
            font-family: sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5), 0 0 60px rgba(168, 85, 247, 0.2);
            cursor: pointer
        }

        .signin {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-family: sans-serif;
            margin-top: -20px;
            margin-bottom: 30px
        }

        .signin a {
            color: rgba(255, 215, 0, 0.7);
            text-decoration: none
        }
    </style>
</head>

<body>
    <div class="phone">
        <div class="stars">
            <div class="star" style="width:2px;height:2px;top:15%;left:10%;animation-delay:0s"></div>
            <div class="star" style="width:1px;height:1px;top:25%;left:85%;animation-delay:.5s"></div>
            <div class="star" style="width:2px;height:2px;top:40%;left:5%;animation-delay:1s"></div>
            <div class="star" style="width:1px;height:1px;top:10%;left:60%;animation-delay:1.5s"></div>
            <div class="star" style="width:3px;height:3px;top:70%;left:90%;animation-delay:.3s"></div>
            <div class="star" style="width:1px;height:1px;top:80%;left:15%;animation-delay:.8s"></div>
            <div class="star" style="width:2px;height:2px;top:55%;left:75%;animation-delay:2s"></div>
        </div>
        <div class="progress">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="prog-label">3 ИЗ 5</div>
        </div>
        <div class="content">
            <div class="zodiac-badge"><span>♏</span><span>Скорпион</span></div>
            <h1>Когда ты родился?</h1>
            <p class="subtitle">Введи точную дату рождения для<br>составления твоей космической карты</p>
            <div class="picker-wrap">
                <div class="cols-header">
                    <span class="col-label">День</span><span class="col-label">Месяц</span><span
                        class="col-label">Год</span>
                </div>
                <div class="cols">
                    <div class="selection-bar"></div>
                    <div class="col">
                        <div class="fade-top"></div>
                        <div class="col-items">
                            <div class="item">15</div>
                            <div class="item">16</div>
                            <div class="item">17</div>
                            <div class="item near">17</div>
                            <div class="item sel">18</div>
                            <div class="item near">19</div>
                            <div class="item">20</div>
                            <div class="item">21</div>
                        </div>
                        <div class="fade-bot"></div>
                    </div>
                    <div class="col">
                        <div class="fade-top"></div>
                        <div class="col-items">
                            <div class="item">Авг</div>
                            <div class="item">Сен</div>
                            <div class="item">Окт</div>
                            <div class="item near">Окт</div>
                            <div class="item sel">Ноябрь</div>
                            <div class="item near">Дек</div>
                            <div class="item">Янв</div>
                            <div class="item">Фев</div>
                        </div>
                        <div class="fade-bot"></div>
                    </div>
                    <div class="col">
                        <div class="fade-top"></div>
                        <div class="col-items">
                            <div class="item">1990</div>
                            <div class="item">1991</div>
                            <div class="item">1992</div>
                            <div class="item near">1992</div>
                            <div class="item sel">1993</div>
                            <div class="item near">1994</div>
                            <div class="item">1995</div>
                            <div class="item">1996</div>
                        </div>
                        <div class="fade-bot"></div>
                    </div>
                </div>
            </div>
            <div style="height:24px"></div>
            <button class="continue-btn">Продолжить</button>
            <p class="signin">Уже есть аккаунт? <a>Войти</a></p>
        </div>
    </div>
</body>

</html>
